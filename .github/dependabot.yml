version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      gradle-dependencies:
        patterns:
          - "*"
    ignore:
      # These are moved by hand, with a build and a check on the emulator (see CLAUDE.md). A KSP patch
      # update (2.2.10-2.0.2 to 2.2.21-2.0.5) already broke the build with AGP 9.
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "com.google.devtools.ksp*"
      - dependency-name: "com.android.*"
      - dependency-name: "androidx.compose:compose-bom"
      - dependency-name: "gradle"
      # These versions were chosen to fix real problems, so only patch updates are offered.
      - dependency-name: "androidx.room*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.robolectric*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.squareup.okhttp3*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.squareup.retrofit2*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
