version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      gradle-dependencies:
        patterns:
          - "*"
    ignore:
      # These versions were chosen to fix real problems (see CLAUDE.md), so only patch updates are offered.
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.google.devtools.ksp*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.android.*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.room*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.robolectric*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.squareup.okhttp3*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.squareup.retrofit2*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
